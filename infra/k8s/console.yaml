# Mission console (Next.js). Stateless: every page load and TTS request is independent, so unlike the server
# it can run any number of replicas behind one Service, and a RollingUpdate replaces them with no downtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
    spec:
      containers:
        - name: console
          image: vbw-console:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Optional Cartesia voice callouts. Without the key the console uses the browser's voice. To enable:
            #   kubectl -n argus create secret generic cartesia --from-literal=CARTESIA_API_KEY=...
            - name: CARTESIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cartesia
                  key: CARTESIA_API_KEY
                  optional: true
            - name: CARTESIA_VOICE_ID
              value: 6ccbfb76-1fc6-48f7-b71d-91ac6298247b
            - name: CARTESIA_MODEL_ID
              value: sonic-3.6
            - name: CARTESIA_VERSION
              value: "2026-08-14"
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: console
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: console
  ports:
    - name: http
      port: 3000
      targetPort: http
