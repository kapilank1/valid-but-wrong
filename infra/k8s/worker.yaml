# Fleet detector workers (vbw/fleet). Each pod owns the vehicles that rendezvous-hash to its ordinal and scores
# all their frames in real time. Scale with:
#   kubectl -n argus scale statefulset worker --replicas=6
# Every pod lists the live worker pods through the API every 2 s and reshards over them, so a pod that is
# Pending, crash-looping or being replaced has its vehicles covered by the others (vbw/fleet/k8s.py). Load: scripts/fleet_report.py.

# Identity the worker pods run as, and the one permission they need: list the pods in this namespace.
# RBAC is deny-by-default, so without this Role the API answers 403.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-list-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-list-pods
subjects:
  - kind: ServiceAccount
    name: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worker-list-pods
---
# A StatefulSet needs a governing headless Service; it gives each pod a stable DNS name
# (worker-0.worker.argus.svc.cluster.local) and exposes the metrics port.
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: metrics
      port: 9100
---
# StatefulSet, not Deployment: pods get stable names worker-0..N-1, and the ordinal in the name is the shard.
# A Deployment's pods get random suffixes (worker-7f9c-x2k), so they'd have no shard identity.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
spec:
  serviceName: worker
  # 1,200 vehicles at 10 Hz need ~12,000 frames/s; one pod scores ~1,500-2,000 on this node, so 8 keep up with
  # headroom (results/fleet_scale.json). Kept here, not only via `kubectl scale`: the next `kubectl apply`
  # resets replicas to whatever this file says.
  replicas: 8
  # Default is OrderedReady (start worker-0, wait until ready, then worker-1, ...). Shards don't depend on each
  # other, so start and stop them all at once.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          # Same image as the server, different command: the code and models are already in it, and pods on a
          # node share image layers, so ten workers don't cost ten copies on disk.
          image: vbw-server:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "vbw.fleet.worker"]
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: FLEET_SIZE
              value: "1200"
            - name: FLEET_ATTACK_FRACTION
              value: "0.1"
            - name: FLEET_SPEED
              value: "1.0"
            - name: FLEET_WORKER_SELECTOR
              value: app.kubernetes.io/name=worker
            # numpy's BLAS would otherwise start a thread per visible core; the worker is one thread by design.
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 20
            periodSeconds: 10
          # One core per pod: the scoring loop is single-threaded, so this makes "replicas" a count of cores and
          # gives each shard a known capacity. requests == limits for CPU so the scheduler reserves the full core.
          resources:
            requests: {cpu: "1", memory: 256Mi}
            # ~0.6 MiB per vehicle plus ~150 MiB of runtime; 1 GiB lets a lone pod hold the whole 1,200-vehicle
            # fleet (a cold start or scale-from-one) without being OOM-killed.
            limits: {cpu: "1", memory: 1Gi}
