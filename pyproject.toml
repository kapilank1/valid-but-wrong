[project]
name = "vbw"
version = "0.1.0"
description = "Valid-But-Wrong: catch CRC-valid but physically wrong telemetry frames"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.4",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pymavlink>=2.4",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

# On Linux (the server Docker image, Vultr) take CPU-only torch wheels: PyPI's linux torch bundles CUDA and made the
# image ~6 GB. Inference is ONNX Runtime on CPU and SB3 policies run on CPU, so nothing needs CUDA at runtime.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vbw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
